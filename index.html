<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hay Job Size Academy · Aditya Birla Capital</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--rd:#D91F27;--dk:#AF2026;--or:#F15C2E;--yl:#FBD440;--bg:#FFF8F2;--sf:#fff;--tx:#2b1a17;--mu:#7a625c;--bd:#f0d9cf;--ok:#1e8e4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1210;--sf:#2a1b18;--tx:#fbefe9;--mu:#c3a69d;--bd:#4a2f29}}
:root[data-theme="dark"]{--bg:#1d1210;--sf:#2a1b18;--tx:#fbefe9;--mu:#c3a69d;--bd:#4a2f29}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:linear-gradient(90deg,var(--dk),var(--rd) 60%,var(--or));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg{background:#fff;border-radius:8px;padding:6px 10px}.lg img{height:30px;display:block}
header h1{font-size:18px;margin:0;flex:1}.xp{background:rgba(0,0,0,.25);border-radius:20px;padding:5px 12px;font-size:13px}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}nav button.on{background:var(--rd);color:#fff}
main{max-width:920px;margin:0 auto;padding:16px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;color:var(--rd)}h3{margin:0 0 6px}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.b{background:var(--rd);color:#fff;border:0;border-radius:24px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:15px}.b.a{background:var(--sf);color:var(--rd);border:2px solid var(--rd)}.b:disabled{opacity:.4;cursor:not-allowed}
.o{border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:7px 9px;cursor:pointer;font-size:13px;text-align:left}
.o.s{border-color:var(--rd);background:rgba(241,92,46,.15);font-weight:700}.o.g2{border-color:var(--ok);background:rgba(30,142,78,.18)}.o.bad{border-color:var(--rd);background:rgba(217,31,39,.15)}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-top:8px}
.pill{display:inline-block;background:var(--yl);color:#3a2a00;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
mark{border-radius:4px;padding:0 3px;color:inherit}.K{background:rgba(217,31,39,.22)}.P{background:rgba(241,92,46,.28)}.A{background:rgba(251,212,64,.55)}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;color:#fff;font-size:12px;font-weight:700}.bar div{overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center;transition:flex .4s;min-width:0}
.big{font-size:30px;font-weight:800;color:var(--rd)}.fb{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(251,212,64,.25)}
.bub{background:rgba(251,212,64,.25);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.stk{position:sticky;top:0;z-index:5}.bd{font-size:34px;filter:grayscale(1);opacity:.35}.bd.on{filter:none;opacity:1}
.cf{position:fixed;top:-30px;font-size:24px;animation:fl 2s linear forwards;z-index:9;pointer-events:none}@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow:auto;max-height:420px;border:1px solid var(--bd);border-radius:8px}.ct{border-collapse:collapse;font-size:11px;min-width:0}.ct th{background:var(--bd);padding:3px 6px;text-align:center}.ct td{border:1px solid var(--bd);text-align:center;padding:3px 6px;cursor:pointer;white-space:nowrap}.ct td:hover{background:rgba(241,92,46,.25)}.ct td.hl{outline:3px solid var(--rd);outline-offset:-3px;font-weight:800}.ct td.ex2{outline:3px dashed #7b2cbf;outline-offset:-3px}.lad{display:flex;gap:4px;overflow-x:auto;padding:4px 0}.lad span{background:var(--bd);border-radius:10px;padding:2px 8px;font-size:12px;flex:none}.ex{font-size:13px;border-left:4px solid var(--or);padding:4px 10px;margin:8px 0}summary{cursor:pointer;margin:6px 0}
.ct th{white-space:nowrap;font-size:11px}.cn{text-align:left!important;white-space:normal!important}.lgd{font-size:12px;line-height:2}.lgd i{display:inline-block;width:14px;height:14px;border:1px solid var(--tx);vertical-align:middle;margin:0 3px 0 8px}.lk{background:var(--sf)}.ll{background:rgba(251,212,64,.5)}.im{background:rgba(110,185,225,.45)}.vt{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700;background:rgba(217,31,39,.12);padding:4px;font-size:11px}#tip{position:fixed;display:none;max-width:300px;background:#2b1a17;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;white-space:pre-line;z-index:30;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}.sc{max-height:560px}
.ct th.hd,.ct td.vt{background:#173a7a;color:#fff}.ct th.hs{background:var(--rd)!important}.ct th.rl{background:var(--bd);text-align:left}.ct td{height:24px}.ct .h1 th{position:sticky;top:0;z-index:3}.ct .h2 th{position:sticky;top:26px;z-index:3}.ct .h3 th{position:sticky;top:52px;z-index:3}.ct td.gl{box-shadow:inset 0 0 0 2px rgba(217,31,39,.4)}.ct th.cn{text-align:left!important;white-space:normal!important}
.ct{table-layout:fixed;border-collapse:separate;border-spacing:0}.ct td,.ct th{border:0;border-right:1px solid #9aa8bf;border-bottom:1px solid #9aa8bf;padding:2px 3px;overflow:hidden}.ct td{text-align:center}.ct th.rl{white-space:normal;font-size:11px;line-height:1.2}.ct th.cn{font-weight:400}.ct .h2 th{top:26px;height:34px;white-space:normal}.ct .h3 th{top:60px}.gbl{border-left:2px solid #173a7a!important}.gbt{border-top:2px solid #173a7a!important}main.wide{max-width:1500px}.ev{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}.evl{position:sticky;top:6px;max-height:calc(100vh - 12px);overflow:auto}.evl .sc{max-height:44vh}.evl .stk{position:static}@media(max-width:900px){.ev{grid-template-columns:1fr}.evl{max-height:58vh}}
.xb{display:inline-block;width:70px;height:6px;background:rgba(0,0,0,.3);border-radius:4px;vertical-align:middle;margin-left:6px}.xb i{display:block;height:100%;background:var(--yl);border-radius:4px}.ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b1a17;color:#fff;padding:10px 18px;border-radius:24px;z-index:40;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.35)}main ul,main ol{margin:6px 0;padding-left:20px}.lt th{width:130px;text-align:left;vertical-align:top;font-size:13px}.lt td{font-size:13px}.cert{border:6px double var(--rd);text-align:center;padding:24px}
.ex{background:rgba(251,212,64,.2);border-radius:6px}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.fi{animation:fi .6s ease both}.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--rd)}
.dm{width:100%;border-collapse:collapse;font-size:13px}.dm th,.dm td{border:1px solid var(--bd);padding:6px;vertical-align:top;text-align:left}.dm th{background:var(--bd)}.dial{height:16px;border-radius:8px;background:linear-gradient(90deg,#d91f27,#fbd440,#1e8e4e);margin:8px 0 2px}
.ct{width:auto;min-width:0;max-width:none}.ct .h1 th{top:0;height:28px}.ct .h2 th{top:28px;height:36px;white-space:normal;line-height:1.15}.ct .h3 th{top:64px;height:28px;font-size:10px}.ct th.cn .mu{font-size:10px;line-height:1.3}

<h1 style="font-size:34px;margin:10px 0 6px">${nm?'Welcome back, '+nm+'!':'Welcome to the Hay Job Size Academy'}</h1>
<p style="font-size:17px;max-width:640px">Learn how jobs are sized with the Hay method, and why it quietly shapes promotions, transfers and pay bands. No HR background needed. Short missions, real Aditya Birla Capital roles, and a bit of friendly competition.</p>
<p><input id="ln" placeholder="What should we call you? (first name)" value="${E2(S.nm||'')}" oninput="S.nm=this.value;sv()" style="padding:11px 14px;border-radius:24px;border:0;width:min(340px,100%);font-size:15px;margin-right:8px"> <button class="b" style="background:#fff;color:var(--dk)" onclick="go('home')">Begin my journey ▶</button>${hp?` <button class="b" style="background:rgba(0,0,0,.28)" onclick="go('learn')">Continue learning ▶</button>`:''}</p></div>
<div class="c fi" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px"><div class="stat"><b>9</b>missions</div><div class="stat"><b>5</b>official Hay charts</div><div class="stat"><b>5</b>real ABC-style roles</div><div class="stat"><b>14</b>badges to earn</div><div class="stat"><b>1</b>certificate</div><div class="stat"><b>~90</b>minutes in total</div></div>
<div class="g fi" style="margin-bottom:14px"><div class="c"><h2>🎯 Why you are here</h2><p>Every job at Aditya Birla Capital has a size, measured in <b>Hay points</b>. That size sits behind who can be promoted, what a transfer really means, and how pay bands are set. As a line manager you write and defend job descriptions, so you should understand how they are read.</p><p class="mu">The big idea: Hay measures the <b>chair</b>, not the person sitting in it.</p></div>
<div class="c"><h2>✅ By the end you will be able to</h2><ul><li>Explain the three factors: Know-How, Problem Solving and Accountability</li><li>Read the official Hay guide charts, row by row and column by column</li><li>Size a real job from its description and calculate its Hay points</li><li>Spot the eight common traps, such as title, headcount and halo</li><li>Hold a fair, evidence-based conversation about a role’s grade</li></ul></div></div>
<div class="c fi"><h2>🗺️ What you will do</h2><div class="g"><div><b>📘 Learn</b><div class="mu">Nine bite-size missions with Aditya Birla Capital examples, quizzes and a glossary.</div></div><div><b>📊 Chart Lab</b><div class="mu">Play with the real Hay charts. Hover or tap for meanings; try Chart Detective.</div></div><div><b>🎯 Evaluate</b><div class="mu">Size five real roles. Watch the calculation build live and get corrected with reasons.</div></div><div><b>🪜 Rank &amp; 🧠 Myths</b><div class="mu">Test your sense of job size and bust the myths that derail promotion talks.</div></div><div><b>⚔️ Boss Battle</b><div class="mu">Ten questions across everything. Pass to earn your certificate.</div></div><div><b>🏅 Progress</b><div class="mu">Aditya Points, levels, streaks, quests and badges keep you moving.</div></div></div></div>
<div class="g fi" style="margin-bottom:14px"><div class="c"><h3>⏱️ How it works</h3><p class="mu">Missions take about 5 minutes each, so you can learn between meetings. Complete a mission to unlock the next one. Your progress is saved on this device, and you can stop and resume any time.</p></div><div class="c"><h3>🎮 Collect as many Aditya Points as you can!</h3><p class="mu"><b>Aditya Points</b> are your scoreboard: aim to collect as many as possible and climb from Newcomer to Hay Legend. Earn Aditya Points and stars, keep a daily streak, finish quests, collect badges and take on the Boss Battle. Wrong answers are corrected with a reason, so every slip is a lesson.</p></div><div class="c"><h3>ℹ️ Good to know</h3><p class="mu">The examples are illustrative learning cases. Actual grading follows Aditya Birla Capital’s HR process, so check with HR on grade mapping and re-evaluation.</p></div></div>
<div class="fi" style="text-align:center;margin:20px 0"><button class="b" style="font-size:18px;padding:14px 34px" onclick="go('home')">Let’s begin ▶</button></div>`}
function vHome(){$('m').innerHTML=`<div class="c" style="background:linear-gradient(120deg,var(--dk),var(--or));color:#fff;border:0"><h2 style="color:#fff;font-size:26px">${fn()?'Hi '+fn()+'! ':''}Size the chair, not the person.</h2><p>Hay Job Evaluation gives every role a size in points. That size sits quietly behind promotions, transfers and pay bands. In about 15 minutes you will learn to size a real Aditya Birla Capital job using the official Hay guide charts, and get coached when you slip.</p><button class="b" style="background:#fff;color:var(--dk)" onclick="go('learn')">Start the journey ▶</button></div>
${homeX()}<h3>Why a busy line manager needs this</h3><div class="g" style="margin-bottom:14px">
<div class="c"><h3>🚀 Promotion</h3><p class="mu">A promotion means moving to a job with a bigger evaluated size. If a role is sized wrongly, so is the career path behind it.</p></div>
<div class="c"><h3>🔁 Transfer</h3><p class="mu">Lateral moves stay in a similar size band. Knowing the band tells you if a move is lateral, a stretch or a step down.</p></div>
<div class="c"><h3>⚖️ Fairness</h3><p class="mu">Two “Managers” can be very different jobs. Hay uses evidence, not titles, so similar jobs are treated alike.</p></div></div>
<div class="c"><h3>Your 5-step journey</h3><table><tr><td>1</td><td><b>Learn</b> the 3 factors in 3 minutes</td></tr><tr><td>2</td><td><b>Chart Lab:</b> play with the real Hay guide charts</td></tr><tr><td>3</td><td><b>Evaluate</b> five ABC roles; the official charts open as you decide</td></tr><tr><td>4</td><td><b>Rank</b> roles and <b>bust myths</b></td></tr><tr><td>5</td><td><b>Collect badges</b> and the manager cheat sheet</td></tr></table></div>${owl('Hoot! Hay evaluates the <b>job’s demands</b>. A star performer in a small job is still in a small job.')}`}
const MODS=[
{ic:'🧭',t:'Why job evaluation matters',sub:'The chair, not the person',s:[
['What is job evaluation?','<p>A systematic way to measure the <b>relative size of jobs</b> so that similar jobs are treated alike. The Hay Guide Chart-Profile Method sizes a job on three universal factors and gives it <b>Hay points</b>.</p><p>Think of it as measuring the <b>chair</b>, not the person sitting on it. The chair does not get bigger because a star performer sits in it.</p>'],
['Why it matters to a line manager','<ul><li><b>Promotion:</b> moving into a bigger evaluated job.</li><li><b>Transfer:</b> a lateral move stays in a similar size band.</li><li><b>Pay and grading:</b> pay ranges are linked to job size.</li><li><b>Fairness:</b> two “Managers” can be very different jobs.</li><li><b>Organisation design:</b> layers, spans and career paths.</li></ul>'],
['What it is NOT','<ul><li>Not performance appraisal (how well someone does the job).</li><li>Not a judgement on a person’s qualifications or effort.</li><li>Not a salary decision by itself.</li><li>Not a head-count or title count.</li></ul>']],
q:[['A star performer takes over a Branch Manager role. What happens to the job’s Hay points?',['They go up because she performs well','They stay the same: the job did not change','They go down if she is paid less'],1,'Hay sizes the job’s demands. Performance is assessed separately.'],['Which is a legitimate reason to re-evaluate a job?',['The incumbent was promoted last year','The role now owns a bigger ₹ result and decides more independently','The manager is very busy'],1,'A material change in the role’s demands (accountability, knowledge, thinking) can change its size.'],['A lateral transfer usually moves someone to…',['A job of similar size','A much bigger job','A smaller job'],0,'Promotion = bigger job; lateral = similar size.']]},
{ic:'🧩',t:'The big picture',sub:'3 factors, 1 formula',s:[
['Three universal factors','<p><b>Know-How</b> = what the job requires you to bring (knowledge, managing, influencing).<br><b>Problem Solving</b> = how much thinking is needed to use that knowledge.<br><b>Accountability</b> = what the job answers for: its freedom to act and its impact on results.</p><p>Input → process → output: <i>Know-How → Problem Solving → Accountability</i>.</p>'],
['The nine dimensions in this programme','<p><span class="pill">Know-How</span> Depth · Scope · Managerial · Communication<br><span class="pill">Problem Solving</span> Thinking environment · Thinking challenge<br><span class="pill">Accountability</span> Freedom to act · Nature of impact · Magnitude</p>'],
['The five charts, in order','<ol><li><b>Know-How chart</b> → KH points</li><li><b>PS % chart</b> → a multiplier (10%–87%)</li><li><b>PS points chart</b> → KH × % → PS points</li><li><b>Accountability chart</b> → AC points</li><li><b>Short Profile chart</b> → KH%, PS%, AC% → <b>Hay points = KH ÷ KH%</b></li></ol>']],
q:[['Which factor measures how much THINKING the job needs?',['Know-How','Problem Solving','Accountability'],1,'Problem Solving is the amount and nature of thinking required.'],['Problem Solving is expressed as…',['A percentage of Know-How','A ₹ value','A count of reports'],0,'You can only think with what you know, so PS is a % of Know-How.'],['Which step gives the total Hay points?',['The PS % chart','The Accountability chart','The Short Profile chart (KH ÷ KH%)'],2,'The Short Profile gives KH%; total = KH ÷ KH%.']]},
{ic:'🧰',t:'Know-How',sub:'What the job must bring',s:[
['Depth of knowledge (A–H)','<table class="lt"><tr><th>A Basic</th><td>Simple routines from a short briefing (e.g. document dispatch)</td></tr><tr><th>B Introductory</th><td>Standard routines learned on the job (e.g. policy servicing executive)</td></tr><tr><th>C Procedural</th><td>Practical methods, some specialised training (e.g. claims or loan processing)</td></tr><tr><th>D Advanced</th><td>Broad specialised methods with some theory (e.g. experienced operations lead)</td></tr><tr><th>E Professional</th><td>Theory-based, degree or professional qualification (e.g. credit underwriter)</td></tr><tr><th>F Seasoned</th><td>Deep/broad expertise, guides other specialists (e.g. senior actuary)</td></tr><tr><th>G Comprehensive</th><td>Cumulative mastery across fields, authoritative for the organisation</td></tr><tr><th>H Authoritative</th><td>Pre-eminent, internationally recognised, ground-breaking</td></tr></table><p class="mu">Illustrative examples. Rate what the job REQUIRES, not the CV of the person.</p>'],
['Scope, managerial and communication','<p><b>Scope:</b> few, several or many techniques, products or disciplines.</p><p><b>Managerial:</b> T Task focused · I Specific (supervises specific activities) · II Related (integrates related operations, annual plan) · III Diverse (diverse functions, 3–5 year view) · IV Broad (strategic leadership).</p><p><b>Communication:</b> 1 Communicate (inform) · 2 Reason (influence with argument; assigns and reviews others’ work) · 3 Change behaviour (motivate, negotiate, build commitment).</p>'],
['Common mistakes','<ul><li>Rating the incumbent’s degree, not the job’s requirement.</li><li>Equating team size with managerial level.</li><li>Giving level 3 communication just because the job meets many people.</li></ul>']],
q:[['A Wealth RM holds a CFA, but the role only needs a graduate with 2 years’ experience. Depth reflects…',['The CFA the person holds','What the job requires','The person’s pay'],1,'Know-How is what the job requires.'],['“Integrating related operations over an annual plan” is managerial level…',['I Specific','II Related','IV Broad'],1,'Level II integrates related operations, usually over the annual plan.'],['Communication level 3 means…',['Courteous exchange of information','Persuading with technical reasoning','Motivating people and changing behaviour'],2,'Level 3 is about influencing, motivating and changing behaviour.']]},
{ic:'🧭',t:'Problem Solving',sub:'How much thinking',s:[
['Two questions','<p><b>Thinking environment:</b> how much do rules, policies and precedents already point to the answer? The tighter the framework, the lower the demand (A Strict routine … H Abstract).</p><p><b>Thinking challenge:</b> how original must the thinking be? 1 Repetitive · 2 Patterned · 3 Variable · 4 Adaptive · 5 Uncharted.</p>'],
['From levels to a percentage','<p>Where environment (row) meets challenge (column) you get <b>two</b> values: typical and upper-end. Example: D Standardised × 3 Variable = <b>29%</b> (33% at the upper end). The % is applied to Know-How points.</p><p>Underwriter: D × 3 → 29%. Servicing executive: B × 2 → 16%. Regional head: F × 4 → 50%.</p>'],
['Rules of thumb','<ul><li>Rate thinking <b>without reference to freedom to act</b>: that belongs to Accountability.</li><li>A busy or tiring job is not the same as a thinking challenge.</li><li>If a policy or precedent solves it, the environment is tighter.</li><li>Likely combinations run along a diagonal; blue cells are improbable.</li></ul>']],
q:[['Problem Solving is rated…',['With reference to the job’s freedom to act','Without reference to freedom to act','Using the ₹ magnitude'],1,'Freedom to act is scored on the Accountability chart.'],['“Similar situations where you choose between known alternatives” is thinking challenge…',['1 Repetitive','2 Patterned','4 Adaptive'],1,'Patterned: discriminating choice between known alternatives.'],['More precedents and detailed procedures mean…',['A tighter environment and a lower PS %','A higher PS %','No change'],0,'Frameworks reduce the thinking demanded.']]},
{ic:'🎯',t:'Accountability',sub:'What the job answers for',s:[
['Order of importance','<p><b>1. Freedom to act</b> (who decides, who checks, and when) → <b>2. Nature of impact</b> → <b>3. Magnitude</b> (the least important).</p>'],
['Freedom to act (A–H)','<p>Ask: <i>how much of the “what, how and when” is set by others, and how closely is it supervised?</i></p><ul><li>A–B: step-by-step instructions, close supervision</li><li>C: standard procedures, periodic supervision</li><li>D: own priorities, <b>results reviewed after the fact</b></li><li>E: delivers annual results within approved plans</li><li>F: sets objectives for others within general direction</li><li>G–H: only overall organisational guidance</li></ul>'],
['Impact and magnitude','<p><b>Nature of impact:</b> R Remote (information) · C Contributory (advice others act on) · S Shared (joint control) · P Prime (controls the result at that level).</p><p><b>Magnitude</b> in annual ₹: 25L–2.5Cr · 2.5–25Cr · 25–250Cr · 250–2,500Cr. Use an <b>annualised</b> figure; for sales roles prefer gross margin to total revenue; judge impact and magnitude <b>together</b>. Where ₹ is not meaningful, use the non-quantified levels I–VI.</p>']],
q:[['Which accountability dimension matters most?',['Magnitude','Freedom to act','Nature of impact'],1,'Freedom to act, then impact, then magnitude.'],['Own priorities, results reviewed after the fact: freedom is closest to…',['B Controlled','D Generally regulated','H Strategically guided'],1,'Level D: review of end results.'],['An analyst whose advice fund managers act on has which impact?',['Remote','Contributory','Prime'],1,'Advisory input others use to decide is Contributory.']]},
{ic:'🔢',t:'From levels to Hay points',sub:'The 15% ladder and the maths',s:[
['The 15% step ladder','<p>Every number on every chart is <b>one step (15%)</b> above the previous one: 38, 43, 50, 57, 66, 76, 87, 100, 115, 132, 152, 175, 200 … 1400. Small judgement differences give small point differences; a two-step difference is about 32%.</p>'],
['Worked example: Credit Underwriter','<ol><li>Know-How: E · Several · I · 2 → <b>200</b></li><li>PS % chart: D × 3 → <b>29%</b></li><li>PS points chart: 200 × 29% = 58 → <b>57</b></li><li>Accountability: D · ₹2.5–25Cr · Shared → <b>100</b></li><li>PS 57 vs AC 100 = 4 steps → profile <b>A4</b></li><li>Short Profile, row 29% · A4: KH <b>56%</b></li><li><b>Hay points = 200 ÷ 56% ≈ 357</b></li></ol>'],
['Try it yourself','<p>Run the same chain in the Chart Lab or the Evaluate screen: the Live calculation panel shows every step.</p><button class="b" onclick="go(\'chart\')">Open Chart Lab ▶</button>']],
q:[['KH = 304 and PS % = 33%. PS points ≈ ?',['100','133','304'],0,'304 × 33% = 100.3 → 100.'],['How many steps from 100 to 132 on the ladder?',['1','2','3'],1,'100 → 115 → 132.'],['Final Hay points are found by…',['Adding the three factors’ percentages','Dividing KH points by the KH % from the Short Profile chart','Multiplying the three factors'],1,'Hay points = KH ÷ KH%.']]},
{ic:'🧬',t:'Profiles',sub:'The shape of a job',s:[
['Reading the shape','<p>Compare PS and AC points: each step between them sets the profile.</p><ul><li><b>P1–P4:</b> PS higher than AC: thinking-led (research, risk modelling, advisory).</li><li><b>Level:</b> equal.</li><li><b>A1–A4:</b> AC higher than PS: results-led (sales, operations, line jobs).</li></ul><p>Typical: P4–P3 fundamental research · P3–P2 applied R&amp;D · P1–A1 advisory · A2 collaborative · A3–A4 line jobs.</p>'],
['Why it matters','<p>The profile is a <b>sense check</b>. A sales head with a P profile, or an actuary with A4, suggests the factors were rated inconsistently. It also sets KH%, which drives the total.</p>']],
q:[['PS 57 and AC 100 gives which profile family?',['P (thinking-led)','Level','A (results-led)'],2,'AC is higher, so A.'],['Which job often has a P profile?',['Branch operations head','Risk modelling specialist','Sales director'],1,'Thinking-led, advisory or research-type jobs.'],['Equal PS and AC points give…',['Level','A1','P1'],0,'Equal means Level.']]},
{ic:'🔍',t:'Evaluate like a pro',sub:'Method and traps',s:[
['A 6-step method','<ol><li>Read the JD for <b>purpose and outcomes</b>.</li><li><b>Highlight evidence</b> by factor.</li><li>Rate <b>Know-How</b>.</li><li>Rate <b>Problem Solving</b> (not using freedom).</li><li>Rate <b>Accountability</b>: freedom first.</li><li><b>Sense-check:</b> profile, boss larger than subordinate, similar benchmark jobs.</li></ol>'],
['Eight traps','<ul><li><b>Title</b>: “Manager” is not a size.</li><li><b>Halo</b>: rating the star, not the seat.</li><li><b>Headcount</b>: team size is not managerial level.</li><li><b>₹</b>: magnitude is the least important.</li><li><b>Everything is prime</b>: prime means you control the result.</li><li><b>Aspiration</b>: duties on paper that never happen.</li><li><b>Legacy</b>: “it was always graded this way”.</li><li><b>Busy</b>: workload is not size.</li></ul>'],
['A JD that can be evaluated','<p class="mu">Weak: “Responsible for sales in the region.”</p><p><b>Strong:</b> “Owns ₹60 Cr annual disbursals for 3 branches; sets pricing within the approved grid; approvals above ₹50L go to the Regional Head; manages 12 staff; needs a graduate with 8+ years of lending experience.”</p><p>Include purpose, outcomes with ₹, decision rights (who approves what), reporting lines, knowledge required and typical problems.</p>']],
q:[['“Senior Vice President” on the business card is evidence of…',['A big job','Nothing by itself: check the demands','Prime impact'],1,'Titles are not evidence.'],['A manager of 25 people runs a routine, tightly scripted process. Managerial know-how is…',['Automatically level IV','Judged on integration and planning, not head-count','Not relevant'],1,'Team size is only a clue.'],['The strongest JD for evaluation contains…',['Long task lists','Outcomes with ₹ values and decision rights','Only the qualifications of the incumbent'],1,'Outcomes and decision rights are what the charts need.']]},
{ic:'🤝',t:'From points to people decisions',sub:'What you can and cannot do',s:[
['What the size can tell you','<ul><li>Higher band = bigger job; same band = lateral; lower = step down.</li><li>Pay ranges follow job size; <b>where</b> a person sits in the range follows performance and experience.</li><li>A job changes size when its <b>demands</b> change materially, not when the person grows.</li></ul>'],
['Your role as a line manager','<ul><li>Keep JDs accurate and evidence-based.</li><li>Flag material role changes to HR early.</li><li>Do not promise grades or negotiate “points”.</li><li>Keep two conversations apart: <b>role size</b> and <b>performance</b>.</li><li>Check ABC’s grade mapping and process with HR: this programme teaches the method.</li></ul>'],
['“Why is my job in this grade?”','<p>1) Listen. 2) Walk through the three factors using evidence from the JD. 3) Show what would have to change in the <b>role</b> for a different size. 4) Offer to raise a re-evaluation request with HR if the role has materially changed. 5) Keep performance feedback separate.</p>']],
q:[['A team member does great work in the same role. The job size…',['Increases','Stays the same','Decreases'],1,'Great performance is rewarded through performance and pay position, not job size.'],['The role has taken on ownership of a new ₹80 Cr portfolio with more freedom. Best step?',['Promise a higher grade','Raise a re-evaluation request with HR','Do nothing'],1,'A material change in demands justifies a fresh evaluation.'],['Which conversation should you keep separate from role size?',['Performance feedback','The job description','Reporting line'],0,'Role size and performance are different questions.']]}];
const EX={
'0.0':'Two “Branch Managers” at Aditya Birla Finance: one leads a 4-person branch in a small town; the other runs a metro branch with 25 staff and a ₹150 Cr disbursal target. Same title, very different chairs, so they carry different Hay points.',
'0.1':'An ABSLI Customer Service Executive is offered a Team Leader role. Hay points show whether this is a bigger job (promotion territory), a similar-size job (lateral) or a smaller one, before anyone debates titles or pay.',
'0.2':'Priya, a Relationship Manager at Aditya Birla Wealth, delivers 140% of target. Her job size does not change: her performance is rewarded through her rating and incentive. Her job grows only when the role itself takes on bigger clients, more freedom or more accountability.',
'1.0':'A Claims Assessor at Aditya Birla Health Insurance: <b>Know-How</b> = policy, medical and claims knowledge; <b>Problem Solving</b> = weighing incomplete hospital documents against policy terms; <b>Accountability</b> = authority to approve claims up to a set limit.',
'1.1':'An Aditya Birla Sun Life AMC Fund Manager: Depth professional to seasoned · Scope many instruments · Thinking environment set by the scheme mandate · Challenge adaptive · Freedom high within the mandate · Impact prime on fund performance · Magnitude large (assets managed).',
'1.2':'Follow an ABFL Credit Underwriter through the chain: Know-How 200 → PS 29% → PS points 57 → Accountability 100 → profile A4 → KH 56% → <b>≈ 357 Hay points</b> (illustrative).',
'2.0':'<b>B</b> ABSLI policy servicing executive following scripts · <b>C</b> loan operations executive processing disbursements · <b>D</b> experienced operations lead or senior underwriter · <b>E</b> credit analyst or financial planner with a professional qualification · <b>F</b> senior actuary or head of investment research guiding specialists.',
'2.1':'<b>Scope:</b> a term-insurance specialist (few) vs a Wealth RM covering mutual funds, PMS, insurance and structured products (many). <b>Managerial:</b> a collections team leader supervises specific activities (I); a Branch Manager integrates sales, service and credit on an annual plan (II); a Regional Head does so across states on a 3-year plan (III). <b>Communication:</b> a servicing executive informs (1); an underwriter explains decisions with reasoning (2); a leader turning around a weak team changes behaviour (3).',
'2.2':'A Wealth RM holds an MBA and a CFA, but the role needs only a graduate with 2 years’ experience. Depth follows the role’s requirement. The MBA and CFA are the person’s assets, not the chair’s.',
'3.0':'A policy servicing executive following an SOP for an address change: Environment B (routine), Challenge 1–2. A claims assessor choosing between approve, part-pay or reject using policy terms: Environment D (standardised), Challenge 3 (variable).',
'3.1':'Underwriter (D × 3) → 29% · Claims assessor (D × 2) → 22% · Branch Manager (E × 3) → 33% · Regional Head (F × 4) → 50%. The % rises as frameworks loosen and problems become newer.',
'3.2':'A collections executive works long hours and handles upset customers: stressful, but the thinking is still patterned within a script. Pressure and workload are not thinking challenge.',
'4.0':'Two ABFL Regional Credit Managers each influence ₹300 Cr. One approves only within a grid and sends every exception to the Credit Head; the other sets credit exceptions for the region within broad guidelines. Same ₹, very different Freedom to act, and that moves the points far more than the ₹ does.',
'4.1':'ABSLI Customer Service Executive: scripts and daily checks (A–B) · ABFL Underwriter: delegated limits, reviewed after the fact (D) · Branch Manager: annual targets, own plan (E) · Regional Head: sets annual objectives for branch managers (F).',
'4.2':'An ABSLAMC research analyst whose views fund managers act on has <b>Contributory</b> impact. An ABFL Branch Manager who controls branch disbursal has <b>Prime</b> impact on ₹60 Cr (band 3). For a sales role, judge Prime on gross margin (value added), not total revenue.',
'5.0':'In the sample roles, a Branch Manager at about 574 points and a Wealth RM at about 397 are roughly three steps apart (1.15³ ≈ 1.5). Small rating slips move points a little; mis-rating freedom or managerial level moves them a lot.',
'5.1':'<b>Branch Manager (ABFL):</b> KH 304 (E · Several · II · 3) → PS 33% → 100 → AC 264 (E · ₹25–250Cr · Prime) → PS 100 vs AC 264 is beyond 4 steps → A4 → KH 53% → 304 ÷ 53% ≈ <b>574</b>.',
'5.2':'Try the <b>Wealth RM</b>: KH 230 · PS 29% → 66 · AC 100 → 3 steps → A3 → KH 58% → 230 ÷ 58% ≈ <b>397</b>. Then rebuild it in the Chart Lab.',
'6.0':'An ABSLI Actuarial Valuation Specialist (heavy analysis, little line accountability) leans <b>P</b>. An ABFL Regional Sales Head who owns disbursal results is <b>A</b>. A digital product owner balancing design thinking and delivery can sit near <b>Level</b>.',
'6.1':'If a Collections Head shows a P profile, ask whether the thinking is really that open or whether Know-How was over-rated. If an Investment Research Head shows A4, ask whether accountability was inflated.',
'7.0':'Take the Credit Underwriter JD: highlight “credit policy, bureau data, finance degree” (Know-How), “varied, incomplete data; approve, reject or counter-offer” (Problem Solving) and “delegated limits; larger cases to the Credit Head; ₹15 Cr” (Accountability). The charts can then be read without guessing.',

'7.2':'<b>Weak (ABHI claims):</b> “Handles claims.” <b>Strong:</b> “Assesses about 60 cashless claims a day up to ₹5L within policy terms; escalates claims above ₹5L and fraud suspects to the Claims Head; needs a graduate with 3 years’ health-claims experience; reviewed weekly on turnaround and leakage.”',

const DF=t=>`<div class="ex">📖 <b>Official definition (Hay Guide Charts)</b><br>${t}</div>`;
MODS[1].s[0]=['The three universal factors, in plain words',`<p>Every job, from a servicing executive to a Regional Head, is measured with the <b>same three yardsticks</b>. Picture the job as a <b>chair</b>: what must whoever sits in it <i>bring</i>, <i>think</i> and <i>answer for</i>?</p><div class="g">
<div class="c" style="border-top:5px solid var(--rd)"><h3>🧰 1. Know-How</h3><p class="mu"><b>Official:</b> every kind of relevant knowledge, skill and experience, however acquired, needed for acceptable performance in a job.</p><p><b>In plain words:</b> what someone must <b>know and be able to do</b> to perform the job acceptably: the technical knowledge, the ability to plan, organise and manage work or people, and the skill to communicate and influence others.</p><p><b>Ask:</b> “What must the job-holder bring?”</p></div>
<div class="c" style="border-top:5px solid var(--or)"><h3>🧭 2. Problem Solving</h3><p class="mu"><b>Official:</b> the amount and nature of the thinking required in the job: analysing, reasoning, evaluating, creating, using judgement, forming hypotheses, drawing inferences and arriving at conclusions. It is the intensity of the mental process that uses Know-How to identify and solve problems.</p><p><b>In plain words:</b> how much <b>real thinking</b> the job demands once you have the knowledge. Is the answer already written in a manual, or must the person work it out?</p><p><b>Ask:</b> “How much of the answer must the job-holder figure out?”</p></div>
<div class="c" style="border-top:5px solid var(--dk)"><h3>🎯 3. Accountability</h3><p class="mu"><b>Official:</b> the extent to which a job is answerable for actions and their consequences. It measures the effect of the job on end-results.</p><p><b>In plain words:</b> what the job <b>answers for</b>: how free it is to decide, how directly it moves the result, and how big that result is in ₹.</p><p><b>Ask:</b> “If this job goes right or wrong, what changes, and who is answerable?”</p></div></div>
<p class="ex">🔗 <b>How they connect:</b> you can only think with what you know (so Problem Solving is a % of Know-How), and what a job answers for is the outcome of using both.</p>`];
MODS[1].s[1]=['The nine dimensions, explained',`<p>Each factor is rated through smaller questions, called dimensions. You will rate all nine in the Evaluate screen.</p><table class="dm"><tr><th>Factor</th><th>Dimension</th><th>What it means in plain words</th><th>Ask yourself</th></tr>
<tr><td rowspan=4><b>Know-How</b></td><td>Depth</td><td>How deep and specialised the knowledge is, from simple routines (A) to world-class expertise (H).</td><td>What must someone already know on day one, and how is it normally acquired?</td></tr>
<tr><td>Scope</td><td>How many different techniques, products or disciplines must be mastered: few, several or many.</td><td>Is it one narrow area or many?</td></tr>
<tr><td>Managerial</td><td>How much the job must plan, organise, co-ordinate and integrate, across how wide an area and how far ahead (T to IV).</td><td>How wide is the work being tied together, and how far ahead must it plan?</td></tr>
<tr><td>Communication</td><td>How critical it is to communicate and influence: 1 inform, 2 reason with others, 3 change behaviour.</td><td>Is the job informing people, persuading them, or changing how they act?</td></tr>
<tr><td rowspan=2><b>Problem Solving</b></td><td>Thinking environment</td><td>How far rules, procedures, precedents and policies already guide the answer (A tightly, H hardly at all).</td><td>How much of the answer is already written down?</td></tr>
<tr><td>Thinking challenge</td><td>How complex and original the problems are, from identical (1) to never seen before (5).</td><td>Are the situations the same, similar, varied, new or unprecedented?</td></tr>
<tr><td rowspan=3><b>Accountability</b></td><td>Freedom to act</td><td>How much the job decides for itself: what to do, how and when, and how closely it is supervised (A to H). The most important dimension.</td><td>Who directs this job, and when and how closely is it checked?</td></tr>
<tr><td>Nature of impact</td><td>How directly the job affects results: Remote, Contributory, Shared or Prime.</td><td>Does it supply information, give advice, share control or own the result?</td></tr>
<tr><td>Magnitude</td><td>The annual ₹ size of the area the job most clearly affects. The least important dimension.</td><td>What ₹ area does the impact land on?</td></tr></table>`];
MODS[2].sub='Every kind of relevant knowledge, skill and experience, however acquired, needed for acceptable performance in a job';
MODS[3].sub='The amount and nature of thinking the job requires: analysing, reasoning, evaluating, creating and using judgement to reach conclusions';
MODS[4].sub='How far the job is answerable for its actions and their consequences: its effect on end-results';
MODS[2].s[0][1]=DF('Know-How includes every kind of relevant knowledge, skill and experience, however acquired, needed for acceptable performance in a job or role. It has three dimensions: <b>practical/technical knowledge</b> (depth and scope), <b>planning, organising and integrating knowledge</b> (managerial) and <b>communicating and influencing skills</b>.')+MODS[2].s[0][1];
MODS[3].s[0][1]=DF('Problem Solving is the amount and nature of the thinking required in the job in the form of analysing, reasoning, evaluating, creating, using judgement, forming hypotheses, drawing inferences and arriving at conclusions. It deals with the intensity of the mental process which uses Know-How to identify and solve problems. It has two dimensions: <b>thinking environment</b> (freedom to think) and <b>thinking challenge</b>.')+MODS[3].s[0][1];
MODS[4].s[0][1]=DF('Accountability assesses the extent to which a job is answerable for actions and their consequences. It measures the effect of the job on end-results. Its three dimensions, in order of importance, are <b>freedom to act</b>, <b>nature of impact</b> and <b>magnitude</b> (area of impact).')+MODS[4].s[0][1];
MODS[4].s[1]=['Freedom to act (A–H): who directs the job, and when is it checked?',`${DF('Freedom to act is the extent to which the job decides on the measures and actions to be taken to achieve the required results. It is a function of the organisational framework, the personal and policy direction, and the processes and systems that control the organisation.')}<p>Ask three questions: <b>① Who sets the objectives? ② Who decides how and when? ③ When, and how closely, is the work reviewed?</b></p><div class="dial"></div><div class="mu" style="display:flex;justify-content:space-between"><span>◀ close, continuous supervision</span><span>own discretion, only broad guidance ▶</span></div><table class="dm" style="margin-top:8px"><tr><th>Level</th><th>What it looks like</th><th>Tell-tale sign</th><th>ABC-style example</th></tr>
<tr><td><b>A</b> Closely controlled</td><td>Direct, detailed, step-by-step instructions; no deviation without permission</td><td>Supervised continuously, hour by hour</td><td>Document dispatch clerk following a daily checklist</td></tr>
<tr><td><b>B</b> Controlled</td><td>Established routines; some latitude to change the order of tasks</td><td>Close supervision, usually daily</td><td>ABSLI policy servicing executive working to scripts</td></tr>
<tr><td><b>C</b> Standardised</td><td>Standard procedures; knows the expected output; no deviation from procedure</td><td>Progress checked periodically</td><td>Loan operations executive with a weekly team-leader review</td></tr>
<tr><td><b>D</b> Generally regulated</td><td>Own priorities and short-term objectives; may deviate from procedure if end results meet standards</td><td>Results reviewed after the fact, within a short time</td><td>ABFL Credit Underwriter within delegated limits</td></tr>
<tr><td><b>E</b> Clearly directed</td><td>Delivers annual results within approved plans and policies; decides how and when</td><td>Direction sets the expected results; reviewed against annual targets</td><td>Branch Manager delivering the branch plan</td></tr>
<tr><td><b>F</b> Generally directed</td><td>Sets annual objectives and priorities for others within a longer-term strategy; wide discretion</td><td>Decisions affecting other functions need consultation and agreement</td><td>Regional Sales Head</td></tr>
<tr><td><b>G</b> Guided</td><td>Sets long-term functional or business strategy within the enterprise mandate</td><td>Guided only by overall organisational objectives</td><td>Chief Risk Officer or CFO of a business</td></tr>
<tr><td><b>H</b> Strategically guided</td><td>Helps create the mandate for the whole enterprise, with external stakeholders</td><td>Only very broad guidance; typical of stand-alone organisations</td><td>CEO of a stand-alone listed company</td></tr></table>`];
EX['4.1']='<b>Spot the level.</b> “Approves personal loans up to ₹5 lakh; anything higher goes to the Credit Head; sampled for audit next month” → <b>D</b> (own decisions, reviewed after the fact). “Follows the daily call script; team leader listens in and corrects on the spot” → <b>B</b>. “Sets next year’s disbursal targets for six branch managers within the business plan” → <b>F</b>.';
MODS[5].s[1]=['Worked example: the Credit Underwriter, with the reason for every number',`<p>We size the <b>ABFL Credit Underwriter</b> (the job description is in the Evaluate screen). Each choice below comes from evidence in the JD. Read across: <b>the evidence → our choice → why → what the chart gives</b>.</p><table class="dm"><tr><th>Step</th><th>Evidence in the JD</th><th>Our choice and why</th><th>Result</th></tr>
<tr><td><b>1 Know-How chart</b></td><td>Credit policy, bureau data, financial analysis; finance degree + 3–5 years; a handful of products; no team; explains decisions to sales</td><td><b>Depth E</b> (professional qualification). <b>Scope Several</b> (a few products). <b>Managerial I</b> (own work, co-ordinates with co-workers; no team). <b>Communication 2</b> (reasons with applicants and sales)</td><td>Row E, middle scope line, column I · 2 → <b>200</b></td></tr>
<tr><td><b>2 PS % chart</b></td><td>Chooses among approve, reject or counter-offer under several credit procedures; varied, incomplete data</td><td><b>Environment D</b> (several different procedures; chooses which applies). <b>Challenge 3</b> (varied cases need analysis and judgement)</td><td>D × 3 → <b>29%</b> (typical value)</td></tr>
<tr><td><b>3 PS points chart</b></td><td>Know-How 200, multiplier 29%</td><td>Problem Solving is a share of Know-How: 200 × 29% = 58. The chart shows the nearest ladder value</td><td><b>57</b></td></tr>
<tr><td><b>4 Accountability chart</b></td><td>Delegated limits; larger cases to the Credit Head, who reviews after the fact; about ₹15 Cr of disbursals, decided jointly</td><td><b>Freedom D</b> (reviewed after the fact). <b>Magnitude 2</b> (₹2.5–25 Cr). <b>Impact Shared</b> (joint with the Credit Head). Typical value chosen</td><td>D · ₹2.5–25 Cr · Shared → <b>100</b></td></tr>
<tr><td><b>5 Steps apart</b></td><td>PS 57, AC 100</td><td>On the ladder: 57 → 66 → 76 → 87 → 100 is 4 steps, so Accountability is clearly higher</td><td>Profile <b>A4</b></td></tr>
<tr><td><b>6 Short Profile chart</b></td><td>Row 29%, column A4</td><td>The table splits the total into shares of KH, PS and AC</td><td>KH <b>56%</b> · PS 16% · AC 28%</td></tr>
<tr><td><b>7 Hay points</b></td><td>KH is 56% of the total</td><td>Total = KH ÷ KH share = 200 ÷ 0.56</td><td><b>≈ 357</b></td></tr></table><p class="mu">Check: 56% of 357 is 200 (Know-How), 16% is about 57 (Problem Solving) and 28% is about 100 (Accountability).</p>`];
EX['5.1']='<b>Branch Manager (ABFL).</b> <b>KH 304:</b> Depth E (lending knowledge at professional level), Scope Several, Managerial II (integrates sales, service and credit on an annual plan), Communication 3 (coaches and motivates the team). <b>PS 33%:</b> Environment E (policy clear, the “how” is own judgement) × Challenge 3 (varied customer and team issues), so 304 × 33% = 100. <b>AC 264:</b> Freedom E (annual results within plan), ₹60 Cr (₹25–250 Cr), Prime (owns the branch result). 100 vs 264 is more than 4 steps, so <b>A4</b> → KH 53% → 304 ÷ 53% ≈ <b>574</b>.';
EX['5.2']='<b>Wealth RM.</b> <b>KH 230:</b> Depth E, Scope Many (funds, PMS, insurance, structured products), Managerial I, Communication 2 (persuades with reasoning). <b>PS 29%:</b> Environment D × Challenge 3, so 230 × 29% ≈ 66. <b>AC 100:</b> Freedom D (reviewed quarterly after the fact), ₹120 Cr (₹25–250 Cr), Contributory (advises; the client decides). 66 vs 100 is 3 steps → <b>A3</b> → KH 58% → 230 ÷ 58% ≈ <b>397</b>.';
const POOL=MODS.flatMap(m=>m.q),QS=[['Complete 3 missions',()=>mc()>=3,30],['Complete all 9 missions',()=>mc()>=9,80],['Evaluate 3 roles',()=>Object.keys(S.r).length>=3,40],['Score 5+ in Chart Detective',()=>S.cd>=5,25],['Rank the roles correctly',()=>S.rk,25],['Bust 5+ myths',()=>S.q>=5,25],['Pass the Boss Battle',()=>S.boss,100]];

let lm=null,lq=0,lw=0,lsel=null,gl=false,ex_=null,dca=null;

let h=`<div class="c"><h2>📘 ${fn()?fn()+'’s':'Your'} learning path</h2><p class="mu">Nine short missions, then the Boss Battle. Read a few cards, pass a quick check, earn Aditya Points and stars. Complete a mission to unlock the next.</p><div class="bar" style="height:22px"><div style="flex:${dn||.01};background:var(--ok)">${dn}/9</div><div style="flex:${9-dn||.01};background:var(--mu)"></div></div></div><div class="g">`;
MODS.forEach((m,i)=>{const st=S.mods[i],u=un(i);h+=`<div class="c" style="${u?'':'opacity:.5'}"><div style="font-size:30px">${m.ic}</div><h3>${i+1}. ${m.t}</h3><div class="mu">${m.sub}</div><p>${st?'⭐'.repeat(st)+'☆'.repeat(3-st):u?'Ready':'🔒 Locked'}</p><button class="b ${st?'a':''}" ${u?'':'disabled'} onclick="opm(${i})">${st?'Review':'Start'}</button></div>`});
h+=`<div class="c" style="border:2px solid var(--rd)"><div style="font-size:30px">⚔️</div><h3>Boss Battle</h3><div class="mu">10 questions from everything you learned. Score 7+ to earn your certificate.</div><p>${S.boss?'🏆 Passed':dn==9?'Ready':'🔒 Finish all 9 missions'}</p><button class="b" ${dn==9?'':'disabled'} onclick="bos()">Fight</button></div><div class="c"><div style="font-size:30px">📖</div><h3>Glossary</h3><div class="mu">Every Hay term in plain English.</div><p></p><button class="b a" onclick="gl=true;vLearn()">Open</button></div></div>`;$('m').innerHTML=h}

function vMod(){const m=MODS[lm],n=m.q.length;let h=`<button class="b a" onclick="lm=null;vLearn()">◀ Back to path</button><div class="c" style="margin-top:10px"><h2>${m.ic} ${lm+1}. ${m.t}</h2><div class="mu">${m.sub}</div></div>`+m.s.map((x,j)=>`<div class="c"><h3>${x[0]}</h3>${x[1]}${EX[lm+'.'+j]?`<div class="ex">🏢 <b>Aditya Birla Capital example</b> <span class="mu">(illustrative)</span><br>${EX[lm+'.'+j]}</div>`:''}</div>`).join('');
if(lq<n){const q=m.q[lq];h+=`<div class="c" style="border:2px solid var(--rd)"><span class="pill">Knowledge check ${lq+1} of ${n}</span><h3 style="margin-top:8px">${q[0]}</h3>`+q[1].map((o,k)=>`<button class="o ${lsel!=null&&k==q[2]?'g2':''} ${lsel==k&&k!=q[2]?'bad':''}" style="display:block;width:100%;margin:4px 0" onclick="lans(${k})">${o}</button>`).join('')+(lsel!=null?`<div class="fb"><b>${lsel==q[2]?OK(lq):NO(lq)}</b> ${q[3]}</div><p><button class="b" onclick="${lq+1<n?'lq++;lsel=null;vLearn()':'fin()'}">${lq+1<n?'Next':'Finish'} ▶</button></p>`:'')+'</div>'}
else{const st=lw==0?3:lw==1?2:1;h+=`<div class="c" style="border:2px solid var(--ok)"><h2>${fn()?fn()+', mission':'Mission'} complete! ${'⭐'.repeat(st)}</h2><p>${lw} wrong answer(s). ${st==3?'Flawless!':'Replay the check for 3 stars.'}</p><p>${lm<8?`<button class="b" onclick="opm(${lm+1})">Next mission ▶</button> `:'<button class="b" onclick="lm=null;vLearn()">Back to path</button> '}<button class="b a" onclick="opm(${lm})">Replay</button></p></div>`}
$('m').innerHTML=h}

NT={K:'Rows A–H = depth of knowledge, with 3 scope lines each. Columns = managerial know-how × communication level.',P:'Rows = thinking environment, columns = thinking challenge. Each box has two separate values (typical, upper). The % you pick is the multiplier.',S:'Page 3 of the guide: Know-How points (column) × PS % (row) give the Problem Solving points.',A:'Freedom to act (rows) × magnitude and nature of impact (columns). Choose lower / typical / higher within the box.',F:'Page 7: the step gap between PS and AC points gives the short profile; the row (PS %) and profile column give KH%, PS% and AC%. Hay points = KH ÷ KH%.'},

let h=`<div class="c"><h2>📊 Chart Lab: the real Hay guide charts</h2><p class="mu">Pick a worked example. Its cell glows with a <b style="color:var(--rd)">red outline</b> on every chart, and the example is explained in the yellow box under each chart. Tap any cell to try your own picks. Hover or tap headings and cells for meanings.</p><b>Worked example:</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">`+RO.map((r,i)=>`<button class="b ${i==exI?'':'a'}" style="padding:5px 12px;font-size:13px" onclick="exI=${i};lab=[...RO[${i}].x,0,1];vChart()">${r.t}</button>`).join('')+`</div></div><div class="c" style="border-left:5px solid var(--yl)"><b>🧪 ${R.t}</b> <span class="mu">${R.e}</span><p>${md(R.j)}</p></div>`+meter(c)+`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">`+Object.keys(G).map(k=>`<button class="b ${cw==k?'':'a'}" onclick="cw='${k}';vChart()">${G[k][0]}</button>`).join('')+'</div>';const g=G[cw];
h+=`<div class="c"><h3>${g[0]} chart</h3><p class="mu">${NT[cw]}</p>${g[1](lab)}</div>`;
h+=`<div class="c" style="background:rgba(251,212,64,.22);border:2px solid var(--or)"><h3>📍 Worked example: ${R.t}, read on the ${g[0]} chart</h3><p>${rdg(cw,lab)}</p>`+g[2].map(i=>`<p style="margin:4px 0"><b>${D[i][1]}:</b> ${D[i][3][lab[i]].replace('|',' · ')}</p>`).join('')+(WH[cw]?`<p class="mu"><b>Why:</b> ${WH[cw]}</p>`:'')+(cw=='F'?lad(lab):'')+`<p class="mu">This box is the worked example, not part of the chart. Tap another cell above to try your own picks.</p></div>`;
$('m').innerHTML=h+detective();foc()}
function dnew(){const t=['K','P','A'][Math.floor(Math.random()*3)],r=n=>Math.floor(Math.random()*n);let q;
if(t=='K'){const a=[r(8),r(3),r(5),r(3)],i=15+2*a[0]+a[1]+2*a[2]+a[3];q={t:`Know-How: depth <b>${LT[a[0]]}</b>, scope <b>${SC[a[1]]}</b>, managerial <b>${MT[a[2]]}</b>, communication <b>${a[3]+1}</b>. How many points?`,v:L,i,e:`Start at 38 and add ${2*a[0]}+${a[1]}+${2*a[2]}+${a[3]} = ${i-15} steps.`}}
else if(t=='P'){const e=r(8),c=r(5),i=e+2*c;q={t:`Problem Solving: environment <b>${LT[e]}</b>, challenge <b>${c+1}</b>. Which typical % applies?`,v:P,i,sf:'%',e:`Start at 10% and add ${e} (environment) + ${2*c} (challenge) = ${i} steps.`}}
else{const f=r(8),g=r(4),n=r(4),i=7+3*f+2*g+2*n;q={t:`Accountability: freedom <b>${LT[f]}</b>, magnitude <b>${BN[g]}</b>, impact <b>${IM[n]}</b>. Points (typical row)?`,v:L,i,e:`Start at 12 and add ${3*f} (freedom) + ${2*g} (magnitude) + ${2*n} (impact) = ${i-7} steps.`}}
const o=[q.i+1,q.i-1,q.i+2,q.i-2].filter(k=>k>=0&&k<q.v.length).sort(()=>Math.random()-.5);q.o=[q.i,o[0],o[1]].sort(()=>Math.random()-.5);return q}
function detective(){if(!dq)dq=dnew();const q=dq;
if(dn>=6)return`<div class="c"><h3>🔍 Chart Detective: ${ds}/6${cm()}</h3><p>${ds>=5?'Brilliant! You read the charts like a Hay pro.':'Good start. Hover cells to see how numbers change, then play again.'}</p><button class="b" onclick="dn=0;ds=0;dq=null;da=null;vChart()">Play again</button> <button class="b a" onclick="go('eval')">Evaluate a job ▶</button></div>`;
return`<div class="c"><h3>🔍 Chart Detective <span class="pill">${dn+1} of 6</span></h3><p>${q.t}</p><div class="g" style="grid-template-columns:repeat(3,1fr)">`+q.o.map(k=>`<button class="o ${da!=null&&k==q.i?'g2':''} ${da==k&&k!=q.i?'bad':''}" style="text-align:center;font-size:18px;padding:12px" onclick="dans(${k})">${q.v[k]}${q.sf||''}</button>`).join('')+'</div>'+(da!=null?`<div class="fb"><b>${da==q.i?OK(dn)+' +8 Aditya Points':NO(dn)+' You were '+Math.abs(da-q.i)+' step(s) off.'}</b> ${q.e}</div><p><button class="b" onclick="dn++;dq=null;da=null;vChart()">Next ▶</button></p>`:'')+'</div>'}
function dans(k){if(da!=null)return;da=k;if(k==dq.i){ds++;add(8)}S.cd=Math.max(S.cd,ds);hd();rd(vChart)}
let ct='K',fa=Array(9).fill(null),wr=Array(9).fill(0);
function setp(i,v){const R=RO[ri];if(sel[i]==v)return;if(fa[i]==null)fa[i]=(v==R.x[i]);if(v!=R.x[i])wr[i]++;sel[i]=v}
const CTL={K:'Know-How',P:'PS %',S:'PS points',A:'Accountability',F:'Profile & total'},CTF={K:chK,P:chP,S:chS,A:chA,F:chF},CP={K:[0,1,2,3],P:[4,5],S:[0,1,2,3,4,5],A:[6,7,8],F:[0,1,2,3,4,5,6,7,8]};
function vEval(){const R=RO[ri],a=sel,ok=a.every(x=>x!=null),c=calc(a.map(x=>x??0)),X=calc(R.x),ex=done?R.x:null,cmp=k=>CP[k].every(i=>a[i]!=null);
let Lf=meter(c,ld&&!done?(c.tot>=ld?'▲ +':'▼ ')+(c.tot-ld):'')+`<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">`+Object.keys(CTL).map(k=>`<button class="b ${ct==k?'':'a'}" style="padding:4px 10px;font-size:12px" onclick="ct='${k}';rd(vEval);foc()">${cmp(k)?'✓ ':''}${CTL[k]}</button>`).join('')+'</div>'+CTF[ct](a,ex)+(ct=='F'?lad(a):'')+'<div style="margin-top:8px"><b>Live calculation</b></div>'+Object.keys(CTL).map(k=>`<div class="fb" style="${k==ct?'outline:2px solid var(--rd)':''}"><b>${CTL[k]}:</b> ${rdg(k,a)}</div>`).join('');
let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">`+RO.map((r,i)=>`<button class="b ${i==ri?'':'a'}" style="padding:5px 12px;font-size:13px" onclick="pr(${i})">${S.r[i]!=null?'✅ ':''}${i+1}. ${r.t}</button>`).join('')+`</div>`;
h+=`<div class="c"><h3>${R.t}</h3><div class="mu">${R.e}</div><p>${md(R.j)}</p><p class="mu"><mark class="K">Know-How evidence</mark> <mark class="P">Problem Solving evidence</mark> <mark class="A">Accountability evidence</mark></p></div>`;
if(!done)h+=owl('Pick a level on the right (or tap a chart cell on the left). The chart and the calculation update instantly, and a wrong choice is corrected with a reason.');
const fbk=(i)=>{if(a[i]==null)return'';const d=D[i],e=R.x[i],[en,ed]=sp(d[3][e]);if(a[i]==e)return`<div class="fb" style="background:rgba(30,142,78,.18)">✅ <b>${OK(i)}</b> ${ed}</div>`;return`<div class="fb" style="background:rgba(217,31,39,.12)">❌ <b>${NO(i+wr[i])} That is ${a[i]>e?'higher':'lower'} than the evidence supports.</b> ${R.c[d[0]]}${wr[i]>=2?`<br>👉 <b>Answer: ${en}</b> – ${ed}`:'<br><i>Re-read the highlighted evidence and try again.</i>'}</div>`};
['K','P','A'].forEach(k=>{h+=`<div class="c" style="border-top:5px solid ${FN[k][1]}"><h3>${FN[k][0]}</h3>`;D.forEach((d,i)=>{if(d[0]!=k)return;const e=R.x[i];h+=`<div style="margin:10px 0"><b>${d[1]}</b> <span class="mu">${d[2]}</span><div class="og">`+d[3].map((l,j)=>`<button class="o ${a[i]==j?'s':''} ${(a[i]==j&&j==e)||((done||wr[i]>=2)&&j==e)?'g2':''} ${a[i]==j&&j!=e?'bad':''}" onclick="pk(${i},${j})">${l.split('|')[0]}</button>`).join('')+`</div><div class="mu" style="margin-top:4px">${a[i]!=null?'📖 '+d[3][a[i]].split('|')[1]:''}</div>${fbk(i)}</div>`});h+='</div>'});
if(done){const n=a.slice(0,9).filter((x,i)=>x==R.x[i]).length,ft=fa.filter(Boolean).length,m=[];
if(a[4]>a[6])m.push('🔎 <b>Sanity check:</b> your thinking environment is freer than your freedom to act. Rate each on its own evidence, then re-check both.');
if(a[6]-R.x[6]>=2)m.push('⚠️ <b>Freedom trap:</b> you gave far more freedom than the evidence shows. Ask <i>who reviews this decision, and when?</i>');
if(a[2]-R.x[2]>=2)m.push('⚠️ <b>Headcount trap:</b> managerial know-how is about integrating work, not just the number of reports.');
if(a[7]-R.x[7]>=1&&a[6]<=R.x[6])m.push('💡 Magnitude is the <b>least</b> important accountability dimension.');
if(c.tot>X.tot*1.25)m.push('📈 <b>Inflation:</b> your total is well above the expert’s. Are you valuing the title or the person?');
if(c.tot<X.tot*.8)m.push('📉 <b>Under-sizing:</b> your total is well below the expert’s.');
if(!m.length)m.push('✨ No common mistakes detected. Clean evaluation.');
h+=`<div class="c" id="res" style="border:2px solid var(--rd)"><h2>${fn()?fn()+', your r':'R'}esult: ${n}/9 correct · ${ft}/9 first try</h2><table><tr><th></th><th>You</th><th>Expert</th></tr><tr><td>Know-How</td><td>${c.kh}</td><td>${X.kh}</td></tr><tr><td>PS % → points</td><td>${c.pct}% → ${c.ps}</td><td>${X.pct}% → ${X.ps}</td></tr><tr><td>Accountability</td><td>${c.ac}</td><td>${X.ac}</td></tr><tr><td>Short profile</td><td>${c.pf} (KH ${c.lq[0]}%)</td><td>${X.pf} (KH ${X.lq[0]}%) · ${PFT(X.pf)}</td></tr><tr><td><b>Hay points</b></td><td><b>${c.tot}</b></td><td><b>${X.tot}</b></td></tr><tr><td>Band (illustrative)</td><td>${c.b}</td><td>${X.b}</td></tr></table>${m.map(x=>`<div class="fb">${x}</div>`).join('')}<p style="margin-top:12px">${ri<4?`<button class="b" onclick="pr(${ri+1})">Next role ▶</button> `:'<button class="b" onclick="go(\'rank\')">Next: Rank the roles ▶</button> '}<button class="b a" onclick="pr(${ri})">Retry</button></p></div>`}
else h+=`<div class="c"><button class="b" ${ok?'':'disabled'} onclick="sub()">${ok?'Finish and see my result':'Choose a level on all 9 dimensions'}</button></div>`;
$('m').innerHTML=`<div class="ev"><div class="evl">${Lf}</div><div>${h}</div></div>`;foc()}
function pr(i){ri=i;sel=[...Array(9).fill(null),0,1];done=false;ld=0;ct='K';fa=Array(9).fill(null);wr=Array(9).fill(0);vEval();scrollTo(0,0)}
function pk(i,j){if(done)return;ld=calc(sel.map(x=>x??0)).tot;setp(i,j);ct=i<4?'K':i<6?'P':'A';rd(vEval)}
function sub(){const R=RO[ri],n=sel.slice(0,9).filter((x,i)=>x==R.x[i]).length,ft=fa.filter(Boolean).length;done=true;if(S.r[ri]==null)add(ft*8+Math.max(0,n-ft)*3+(n==9?30:0));S.r[ri]=Math.max(S.r[ri]||0,n);if(n>=7)cf();hd();vEval();scrollTo(0,$('res').offsetTop-80)}
function vRank(){const T=ro.map(i=>calc(RO[i].x).tot),srt=[...ro].sort((p,q)=>calc(RO[p].x).tot-calc(RO[q].x).tot);
let h=`<div class="c"><h2>Rank by job size</h2><p class="mu">Order the roles from <b>smallest (top)</b> to <b>largest (bottom)</b> using your gut feel, then check. A good sense of size makes you a better manager and a better evaluator.</p>`+ro.map((r,k)=>`<div class="c" style="margin:6px 0;padding:8px 12px;display:flex;align-items:center;gap:8px"><b style="width:20px">${k+1}</b><div style="flex:1"><b>${RO[r].t}</b><div class="mu">${RO[r].e}${rkd?' · <b>'+T[k]+' pts · Band '+calc(RO[r].x).b+'</b>':''}</div></div>${rkd?(r==srt[k]?'✅':'❌'):`<button class="b a" style="padding:2px 10px" onclick="mv(${k},-1)">▲</button><button class="b a" style="padding:2px 10px" onclick="mv(${k},1)">▼</button>`}</div>`).join('');
h+=rkd?`<div class="fb">${ro.every((r,k)=>r==srt[k])?'🎉 Perfect order'+cm()+'! +40 Aditya Points. Notice the gaps: a boss’s job should clearly outsize the direct report’s.':'Expected order (small → large): '+srt.map(i=>RO[i].t).join(' → ')+'. Hint: more freedom, bigger ₹ and prime impact usually beat team size.'}</div><p><button class="b a" onclick="rkd=false;ro=[3,0,4,1,2];vRank()">Try again</button></p>`:`<p><button class="b" onclick="ck()">Check my order</button></p>`;$('m').innerHTML=h+'</div>'}
function mv(k,d){const j=k+d;if(j<0||j>4)return;[ro[k],ro[j]]=[ro[j],ro[k]];vRank()}
function ck(){const s=[...ro].sort((p,q)=>calc(RO[p].x).tot-calc(RO[q].x).tot);rkd=true;if(ro.every((r,k)=>r==s[k])){if(!S.rk)add(40);S.rk=1;cf()}hd();vRank()}
function vMyth(){if(qi>=MY.length){$('m').innerHTML=`<div class="c"><h2>${fn()?fn()+', your':'Your'} Myth Buster score: ${qc}/${MY.length}</h2>${owl(qc>=5?'Excellent! You will spot these traps in promotion discussions.':'Review the explanations and try again.')}<p><button class="b" onclick="qi=0;qc=0;qa=null;vMyth()">Play again</button> <button class="b a" onclick="go('prog')">See progress ▶</button></p></div>`;return}
const q=MY[qi];$('m').innerHTML=`<div class="c"><span class="pill">Myth ${qi+1} of ${MY.length}</span><h2 style="margin-top:8px">“${q[0]}”</h2><p class="mu">True or false?</p><div class="g" style="grid-template-columns:1fr 1fr"><button class="o ${qa!=null&&q[1]==1?'g2':''} ${qa===1&&q[1]!=1?'bad':''}" style="font-size:18px;text-align:center;padding:14px" onclick="qn(1)">✔ True</button><button class="o ${qa!=null&&q[1]==0?'g2':''} ${qa===0&&q[1]!=0?'bad':''}" style="font-size:18px;text-align:center;padding:14px" onclick="qn(0)">✘ False</button></div>`+(qa!=null?`<div class="fb"><b>${qa==q[1]?OK(qi)+' +10 Aditya Points':NO(qi)}</b> ${q[2]}</div><p><button class="b" onclick="qi++;qa=null;vMyth()">Next ▶</button></p>`:'')+'</div>'}
function qn(v){if(qa!=null)return;qa=v;if(v==MY[qi][1]){qc++;add(10)}S.q=Math.max(S.q,qc);hd();vMyth()}

$('m').innerHTML=`<div class="c"><h2>${fn()?fn()+' · ':''}${TT[li_][1]} · ${S.xp} Aditya Points</h2><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));text-align:center"><div><div class="big">${S.st||1}🔥</div><div class="mu">day streak</div></div><div><div class="big">${mc()}/9</div><div class="mu">missions</div></div><div><div class="big">${Object.keys(S.r).length}/5</div><div class="mu">roles evaluated</div></div><div><div class="big">${nb}/${BDG.length}</div><div class="mu">badges</div></div></div></div>
<div class="c"><h3>☀️ Keep collecting Aditya Points</h3><p>${earn()}</p></div><div class="c"><h3>Badges</h3><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">`+BDG.map(b=>`<div style="text-align:center"><div class="bd ${b[2]()?'on':''}">${b[0]}</div><div class="mu">${b[1]}</div></div>`).join('')+`</div></div>
<div class="c"><h3>🧭 Quests</h3>`+QS.map((x,i)=>`<div class="mu">${S.qd[i]?'✅':'⬜'} ${x[0]} <b>+${x[2]} Aditya Points</b></div>`).join('')+`</div>`+(S.boss?`<div class="c"><h3>🎓 Your certificate</h3><p class="mu">Type your name:</p><input value="${E2(S.nm||'')}" oninput="S.nm=this.value;sv();document.getElementById('cn').textContent=this.value||'Your name'" style="padding:8px;border-radius:8px;border:1px solid var(--bd);width:260px;background:var(--sf);color:var(--tx)"><div class="cert" style="margin-top:12px"><div class="mu">ADITYA BIRLA CAPITAL</div><h2>Certificate of Completion</h2><p>This certifies that</p><h2 id="cn" style="color:var(--tx)">${E2(S.nm||'Your name')}</h2><p>has completed the <b>Hay Job Evaluation Academy for Line Managers</b> and passed the Boss Battle.</p><div class="mu">${d}</div></div></div>`:'')+`<div class="c"><h2>Manager cheat sheet</h2><table><tr><td>1</td><td>Evaluate the <b>job</b>, never the person.</td></tr><tr><td>2</td><td>Find <b>evidence</b> in the JD: who reviews decisions, ₹ at stake, team and knowledge needed.</td></tr><tr><td>3</td><td><b>Freedom to act</b> matters most in Accountability, then impact, then ₹ magnitude.</td></tr><tr><td>4</td><td>Rate Problem Solving on its own evidence, not on freedom.</td></tr><tr><td>5</td><td>Hay points = KH ÷ KH% from the Short Profile chart.</td></tr><tr><td>6</td><td>A boss’s job must outsize the direct report’s. If not, recheck.</td></tr></table><p class="mu">Illustrative scales for learning. Actual grading follows Aditya Birla Capital’s HR process.</p></div>`}
